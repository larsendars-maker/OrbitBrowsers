name: Build Orbit Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: write

jobs:
  android:
    name: Build Orbit Browser APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Configure Android SDK
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Build APK
        working-directory: android
        run: gradle clean assembleDebug --stacktrace --console=plain --no-daemon

      - name: Prepare APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/OrbitBrowser.apk
          sha256sum output/OrbitBrowser.apk > output/SHA256.txt
          ls -lh output/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrbitBrowser-APK
          path: output/*
          if-no-files-found: error

      - name: Publish Android Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Android
          name: Orbit Browser Android
          body: "Orbit Browser для Android."
          prerelease: false
          make_latest: false
          files: |
            output/OrbitBrowser.apk
            output/SHA256.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
