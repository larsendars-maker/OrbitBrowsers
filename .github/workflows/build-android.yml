name: Build Orbit Android

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Configure SDK
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Validate project files
        run: |
          test -f android/app/src/main/java/com/orbit/browser/MainActivity.kt
          test -f android/app/build.gradle.kts
          test -f android/gradle.properties

      - name: Build APK and AAB
        working-directory: android
        run: gradle clean assembleDebug bundleRelease --stacktrace --console=plain --no-daemon

      - name: Prepare files
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/OrbitBrowser.apk
          cp android/app/build/outputs/bundle/release/app-release.aab output/OrbitBrowser.aab
          sha256sum output/OrbitBrowser.apk output/OrbitBrowser.aab > output/SHA256.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OrbitBrowser-Android
          path: output/*

      - name: Publish Android Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view Android >/dev/null 2>&1; then
            gh release create Android --title "Orbit Browser Android" --notes "Orbit Browser 2.0 для Android."
          fi
          gh release upload Android output/OrbitBrowser.apk output/OrbitBrowser.aab output/SHA256.txt --clobber
