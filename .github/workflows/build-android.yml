name: Build Orbit Android

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Configure SDK
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Validate project files
        run: |
          test -f android/app/src/main/java/com/orbit/browser/MainActivity.kt
          test -f android/app/build.gradle.kts
          test -f android/gradle.properties

      - name: Configure signing
        shell: bash
        env:
          ORBIT_KEYSTORE_B64: ${{ secrets.ORBIT_ANDROID_KEYSTORE_B64 }}
          ORBIT_STORE_PASSWORD: ${{ secrets.ORBIT_ANDROID_STORE_PASSWORD }}
          ORBIT_KEY_ALIAS: ${{ secrets.ORBIT_ANDROID_KEY_ALIAS }}
          ORBIT_KEY_PASSWORD: ${{ secrets.ORBIT_ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ORBIT_KEYSTORE_B64" ]; then
            echo "$ORBIT_KEYSTORE_B64" | base64 --decode > android/orbit-release.keystore
            cat > android/signing.properties <<EOF
          storeFile=orbit-release.keystore
          storePassword=$ORBIT_STORE_PASSWORD
          keyAlias=$ORBIT_KEY_ALIAS
          keyPassword=$ORBIT_KEY_PASSWORD
          EOF
            echo "ORBIT_SIGNING_READY=true" >> "$GITHUB_ENV"
          else
            echo "ORBIT_SIGNING_READY=false" >> "$GITHUB_ENV"
            echo "No Android signing secrets configured; release APK will not be published as an update build."
          fi

      - name: Build APK
        working-directory: android
        run: gradle clean assembleRelease --stacktrace --console=plain --no-daemon

      - name: Prepare files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          APK_PATH="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name "*.apk" -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo "No APK was produced by Gradle."
            echo "Available outputs:"
            find android/app/build/outputs -maxdepth 5 -type f -print || true
            exit 1
          fi
          echo "Using APK: $APK_PATH"
          cp "$APK_PATH" output/OrbitBrowser.apk
          sha256sum output/OrbitBrowser.apk > output/SHA256.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OrbitBrowser-Android
          path: output/*

      - name: Publish Android Release
        if: env.ORBIT_SIGNING_READY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view Android >/dev/null 2>&1; then
            gh release create Android --title "Orbit Browser Android" --notes "Orbit Browser 2.3 для Android."
          fi
          gh release upload Android output/OrbitBrowser.apk output/SHA256.txt --clobber

      - name: Explain unsigned build
        if: env.ORBIT_SIGNING_READY != 'true'
        run: echo "APK artifact built, but publishing is skipped until Android signing secrets are configured."
