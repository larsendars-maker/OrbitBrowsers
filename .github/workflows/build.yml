name: Build Orbit Browser

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  windows:
    name: Windows EXE
    runs-on: windows-latest

    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Windows
        run: npm run dist

      - name: Find Windows builds
        shell: powershell
        run: |
          Get-ChildItem -Path . -Recurse -Include *.exe |
            ForEach-Object {
              Write-Host $_.FullName
            }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OrbitBrowser-Windows
          path: |
            desktop/dist/*.exe
            desktop/release/*.exe
          if-no-files-found: error


  android:
    name: Android APK + AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create local.properties
        shell: bash
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Build Android APK
        working-directory: android
        run: gradle assembleDebug --stacktrace --console=plain

      - name: Build Android AAB
        working-directory: android
        run: gradle bundleRelease --stacktrace --console=plain

      - name: Prepare Android artifacts
        shell: bash
        run: |
          mkdir -p output

          cp android/app/build/outputs/apk/debug/app-debug.apk \
             output/OrbitBrowser.apk

          find android/app/build/outputs/bundle \
            -type f -name "*.aab" \
            -exec cp {} output/OrbitBrowser.aab \;

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OrbitBrowser-Android
          path: |
            output/OrbitBrowser.apk
            output/OrbitBrowser.aab
          if-no-files-found: error


  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - windows
      - android

    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: OrbitBrowser-Windows
          path: release/windows

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: OrbitBrowser-Android
          path: release/android

      - name: Show release files
        shell: bash
        run: |
          echo "=== WINDOWS ==="
          find release/windows -type f

          echo "=== ANDROID ==="
          find release/android -type f

      - name: Create ZIP with Windows builds
        shell: bash
        run: |
          cd release/windows
          zip -r ../OrbitBrowser-Windows.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: manual-${{ github.run_number }}
          name: Orbit Browser Build ${{ github.run_number }}
          generate_release_notes: true
          files: |
            release/windows/OrbitBrowser-Windows.zip
            release/android/OrbitBrowser.apk
            release/android/OrbitBrowser.aab
