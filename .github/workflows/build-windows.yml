name: Build Orbit Browser EXE
on:
  workflow_dispatch:
  push:
    paths:
      - '**.py'
      - 'assets/**'
      - 'OrbitBrowser.iss'
      - '.github/workflows/build-windows.yml'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip install --upgrade pip
          pip install PySide6 requests pyinstaller
      - run: python build_exe.py
      - shell: pwsh
        run: choco install innosetup -y --no-progress
      - shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "OrbitBrowser.iss"'
      - shell: pwsh
        run: Copy-Item 'build_out\OrbitBrowser.exe' 'OrbitBrowser-Portable.exe'
      - uses: actions/upload-artifact@v4
        with:
          name: OrbitBrowser-Windows
          path: |
            OrbitBrowser-Portable.exe
            installer/OrbitBrowser-Setup.exe
