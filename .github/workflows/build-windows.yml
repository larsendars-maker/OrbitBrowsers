name: Build Orbit Windows

on:
  workflow_dispatch:
  push:
    paths:
      - "**/*.py"
      - "assets/**"
      - "web/**"
      - ".github/workflows/build-windows.yml"
      - "OrbitBrowser.iss"
      - "version_info.txt"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --upgrade pip PySide6 requests pyinstaller

      - name: Smoke test
        run: python tools/smoke_test.py

      - name: Build EXE
        shell: pwsh
        run: |
          $root = (Get-Location).Path
          $assets = Join-Path $root "assets"
          $icon = Join-Path $assets "orbit_icon.ico"
          $version = Join-Path $root "version_info.txt"
          python -m PyInstaller --noconfirm --clean --windowed --onefile --noconsole `
            --name OrbitBrowser `
            --distpath "$root\build_out" --workpath "$root\build_work" --specpath "$root\build_spec" `
            --add-data "$assets;assets" `
            --icon "$icon" `
            --version-file "$version" `
            "$root\orbit_browser.py"
          if (!(Test-Path "build_out/OrbitBrowser.exe")) { throw "OrbitBrowser.exe not produced" }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OrbitBrowser-Windows
          path: |
            build_out/OrbitBrowser.exe

      - name: Publish Windows Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view Windows *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create Windows --title "Orbit Browser Windows" --notes "Orbit Browser 2.3 для Windows."
          }
          gh release upload Windows build_out/OrbitBrowser.exe --clobber
