name: Build Orbit Windows

on:
  workflow_dispatch:
  push:
    paths:
      - "*.py"
      - "orbit_core.py"
      - "assets/**"
      - "web/**"
      - ".github/workflows/build-windows.yml"
      - "OrbitBrowser.iss"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --upgrade pip PySide6 requests pyinstaller

      - name: Smoke test
        run: python tools/smoke_test.py

      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onefile --noconsole `
            --name OrbitBrowser `
            --distpath build_out --workpath build_work --specpath build_spec `
            --add-data "assets;assets" `
            --icon "assets/orbit_icon.ico" `
            --version-file "version_info.txt" `
            "orbit_browser.py"
          if (!(Test-Path "build_out/OrbitBrowser.exe")) { throw "OrbitBrowser.exe not produced" }
          Copy-Item "build_out/OrbitBrowser.exe" "build_out/OrbitBrowser-Portable.exe" -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "OrbitBrowser.iss"
          if (!(Test-Path "installer/OrbitBrowser-Setup.exe")) { throw "Installer not produced" }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OrbitBrowser-Windows
          path: |
            build_out/OrbitBrowser.exe
            build_out/OrbitBrowser-Portable.exe
            installer/OrbitBrowser-Setup.exe

      - name: Publish Windows Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view Windows *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create Windows --title "Orbit Browser Windows" --notes "Orbit Browser 1.12 для Windows."
          }
          gh release upload Windows build_out/OrbitBrowser.exe build_out/OrbitBrowser-Portable.exe installer/OrbitBrowser-Setup.exe --clobber
