name: Build Orbit Browser EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip && pip install PySide6 requests pyinstaller
      - run: python build_exe.py
      - uses: actions/upload-artifact@v4
        with:
          name: OrbitBrowser-Windows
          path: dist/OrbitBrowser.exe
