name: Orbit Browser Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 requests pyinstaller

      - name: Build Portable EXE
        run: python build_exe.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Setup EXE
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' 'OrbitBrowser.iss'

      - name: Rename Portable
        shell: pwsh
        run: Copy-Item 'build_out\OrbitBrowser.exe' 'OrbitBrowser-Portable.exe'

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orbit-windows
          path: |
            OrbitBrowser-Portable.exe
            installer/OrbitBrowser-Setup.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK and AAB
        working-directory: android
        run: gradle assembleRelease bundleRelease --stacktrace --console=plain

      - name: Prepare Android artifacts
        run: |
          mkdir -p release-android
          cp android/app/build/outputs/apk/release/*.apk release-android/OrbitBrowser.apk
          cp android/app/build/outputs/bundle/release/*.aab release-android/OrbitBrowser.aab

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orbit-android
          path: release-android/*

  secure-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan repository for obvious secrets
        run: python tools/scan_secrets.py

  release:
    needs: [windows, android, secure-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: orbit-windows
          path: release

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: orbit-android
          path: release

      - name: Create checksum manifest
        shell: bash
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/OrbitBrowser-Portable.exe
            release/OrbitBrowser-Setup.exe
            release/OrbitBrowser.apk
            release/OrbitBrowser.aab
            release/SHA256SUMS.txt
          generate_release_notes: true
