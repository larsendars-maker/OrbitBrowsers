name: Orbit Browser - Windows + Android

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  security:
    name: Security check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Scan for obvious secrets
        run: python tools/scan_secrets.py

  windows:
    name: Build Windows EXE
    runs-on: windows-latest
    needs: security
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 requests pyinstaller
      - name: Build Portable EXE
        run: python build_exe.py
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build Setup EXE
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "OrbitBrowser.iss"'
      - name: Collect Windows artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path output | Out-Null
          Copy-Item 'build_out\OrbitBrowser.exe' 'output\OrbitBrowser-Portable.exe'
          Copy-Item 'installer\OrbitBrowser-Setup.exe' 'output\OrbitBrowser-Setup.exe'
          Get-ChildItem output
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OrbitBrowser-Windows
          path: output/*
          if-no-files-found: error

  android:
    name: Build Android APK + AAB
    runs-on: ubuntu-latest
    needs: security
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Configure Android SDK
        shell: bash
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
      - name: Build debug APK
        working-directory: android
        run: gradle clean assembleDebug --stacktrace --console=plain --no-daemon
      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --stacktrace --console=plain --no-daemon
      - name: Build AAB
        working-directory: android
        run: gradle bundleRelease --stacktrace --console=plain --no-daemon
      - name: Collect Android artifacts
        shell: bash
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/OrbitBrowser.apk
          if [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk output/OrbitBrowser-release-unsigned.apk
          elif [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk output/OrbitBrowser-release.apk
          fi
          cp android/app/build/outputs/bundle/release/app-release.aab output/OrbitBrowser.aab
          sha256sum output/* > output/SHA256SUMS.txt
          find output -maxdepth 1 -type f -print
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OrbitBrowser-Android
          path: output/*
          if-no-files-found: error

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [windows, android]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: OrbitBrowser-Windows
          path: release
      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: OrbitBrowser-Android
          path: release
      - name: Create checksums
        shell: bash
        run: |
          cd release
          sha256sum *.exe *.apk *.aab > SHA256SUMS.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/OrbitBrowser-Portable.exe
            release/OrbitBrowser-Setup.exe
            release/OrbitBrowser.apk
            release/OrbitBrowser-release-unsigned.apk
            release/OrbitBrowser-release.apk
            release/OrbitBrowser.aab
            release/SHA256SUMS.txt
          generate_release_notes: true

