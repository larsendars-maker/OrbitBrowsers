name: Build Orbit Browser Android

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать проект
        uses: actions/checkout@v4

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Установить Android SDK
        uses: android-actions/setup-android@v3

      - name: Разрешить запуск Gradle
        working-directory: android
        run: chmod +x gradlew

      - name: Собрать APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Подготовить APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/OrbitBrowser.apk

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: OrbitBrowser-APK
          path: output/OrbitBrowser.apk
