services:
  - type: web
    name: orbit-api
    runtime: python
    plan: free
    buildCommand: pip install -r server/requirements.txt
    startCommand: uvicorn server.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ORBIT_RELEASE_URL
        value: https://github.com/larsendars-maker/OrbitBrowsers/releases/latest
      - key: DATABASE_URL
        fromDatabase:
          name: orbit-postgres
          property: connectionString
      - key: ORBIT_FOUNDER_USERNAME
        value: Larsenda
      - key: ORBIT_FOUNDER_EMAIL
        sync: false
      - key: ORBIT_FOUNDER_PASSWORD
        sync: false
      - key: ORBIT_WEB_ORIGINS
        sync: false
      - key: ORBIT_ANALYTICS_SECRET
        sync: false
      - key: ORBIT_DOWNLOAD_URL
        sync: false
      - key: ORBIT_DOWNLOAD_VERSION
        sync: false
      - key: ORBIT_DOWNLOAD_FILE_NAME
        value: OrbitBrowser-Setup.exe

databases:
  - name: orbit-postgres
    plan: free

# Set these in the Render dashboard as secrets; do not commit real values.
