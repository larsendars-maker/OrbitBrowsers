<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orbit Search</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#1b1d5b 0,#090b1b 42%,#05060d 100%);color:#f7f7ff;font-family:Arial,sans-serif}
main{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:34px 18px}
.logo{width:76px;height:76px;border-radius:24px;object-fit:cover;box-shadow:0 12px 45px #6575ff55}.brand{font-size:34px;font-weight:800;margin:14px 0 4px}.sub{color:#9ca6c7;text-align:center;margin-bottom:26px}
.search{width:100%;max-width:620px;display:flex;gap:8px;background:#11172d;border:1px solid #4655b6;border-radius:18px;padding:7px}.search input{flex:1;background:transparent;border:0;outline:0;color:white;font-size:16px;padding:13px}.search button{border:0;border-radius:13px;padding:0 20px;background:linear-gradient(90deg,#5f75ff,#a86cff);color:white;font-weight:700}
.grid{width:100%;max-width:620px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px}.card{background:#0e1428cc;border:1px solid #27325d;border-radius:16px;padding:15px;text-align:center}.card b{display:block;margin-bottom:6px}.card span{font-size:12px;color:#8f99b8}@media(max-width:480px){.grid{grid-template-columns:1fr 1fr}.brand{font-size:30px}}
</style></head><body><main>
<img class="logo" src="file:///android_asset/orbit_icon.png" onerror="this.style.display='none'" alt="Orbit"><div class="brand">Orbit Search</div>
<div class="sub">Поиск и навигация внутри Orbit</div>
<form class="search" onsubmit="go(event)"><input id="q" placeholder="Поиск в Orbit или адрес сайта" autofocus><button>Искать</button></form>
<div class="grid"><div class="card"><b>Orbit</b><span>Поиск по умолчанию</span></div><div class="card"><b>Профиль</b><span>Аккаунт и синхронизация</span></div><div class="card"><b>Офлайн</b><span>Snake и Block Blast</span></div></div>
<script>
function go(e){e.preventDefault();let q=document.getElementById('q').value.trim();if(!q)return;
if(q.startsWith('http://')||q.startsWith('https://')) location.href=q;
else if(q.includes('.')&&!q.includes(' ')) location.href='https://'+q;
else location.href='file:///android_asset/orbit_search.html?q='+encodeURIComponent(q);}
</script></main></body></html>
