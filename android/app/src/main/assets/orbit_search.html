<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orbit Search</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#1f2a78 0,#080b19 52%,#04050b 100%);color:#f7f8ff;font-family:Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:28px 16px}.brand{text-align:center;font-size:30px;font-weight:800;margin:10px 0 18px;background:linear-gradient(90deg,#54d7ff,#7885ff,#d15cff);-webkit-background-clip:text;color:transparent}.search{display:flex;gap:8px;background:#10182f;border:1px solid #4056a8;border-radius:16px;padding:6px}.search input{flex:1;background:transparent;border:0;outline:0;color:#fff;padding:12px;font-size:16px}.search button{border:0;border-radius:11px;padding:0 18px;background:linear-gradient(90deg,#5277ff,#b25cff);color:#fff;font-weight:700}.status{color:#9eaccd;margin:16px 0}.result{padding:14px;border:1px solid #283962;background:#0c1428;border-radius:14px;margin:10px 0}.result a{color:#d7ddff;text-decoration:none;font-weight:700}.url{color:#63d3ff;font-size:12px;margin-top:5px;word-break:break-all}</style></head><body><div class="wrap"><div class="brand">ORBIT SEARCH</div><form class="search" onsubmit="go(event)"><input id="q"><button>Искать</button></form><div id="status" class="status">Загрузка…</div><div id="results"></div></div><script>const p=new URLSearchParams(location.search),q=p.get('q')||'';document.getElementById('q').value=q;async function go(e){e.preventDefault();const v=document.getElementById('q').value.trim();if(v)location.href='file:///android_asset/orbit_search.html?q='+encodeURIComponent(v)}async function load(){if(!q){document.getElementById('status').textContent='Введите запрос';return}try{const r=await fetch('https://orbit-api-9uqa.onrender.com/api/search?q='+encodeURIComponent(q));const d=await r.json();const box=document.getElementById('results');box.innerHTML='';(d.results||[]).forEach(x=>{const el=document.createElement('div');el.className='result';el.innerHTML='<a href="'+x.url+'">'+x.title+'</a><div class="url">'+x.url+'</div>';box.appendChild(el)});document.getElementById('status').textContent=(d.results||[]).length+' результатов Orbit'}catch(e){document.getElementById('status').textContent='Orbit Search временно недоступен'}}load()</script></body></html>
